[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brasileirao-sim"
version = "0.1.0"
description = "Simulador do Brasileirão (Monte Carlo + Dixon-Coles) com backtest rodada a rodada."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "duckdb>=1.0",
  "pandas>=2.0",
  "pyarrow>=14",
  "requests>=2.31",
  "numpy>=1.26",
  "scipy>=1.11",
  "dbt-core>=1.8",
  "dbt-duckdb>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
