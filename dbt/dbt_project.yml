name: brasileirao_sim
version: "0.1.0"
config-version: 2
profile: brasileirao_sim

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Pasta com os Parquets gerados pela ingestão (relativa à pasta dbt/)
  raw_dir: "../data/raw"
  # Deve bater com SCHEMA_VERSION em src/brasileirao_sim/ingest/footballdata_uk.py
  fduk_schema_version: 2
  # Saídas do backtest (versionadas no repositório)
  results_dir: "../results/backtest"

models:
  brasileirao_sim:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
    evaluation:
      +materialized: table
