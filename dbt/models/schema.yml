version: 2

seeds:
  - name: team_aliases
    description: "De-para dos nomes de times das fontes para um team_id canônico."
    columns:
      - name: alias
        tests: [unique, not_null]
      - name: team_id
        tests: [not_null]

models:
  - name: stg_fduk_matches
    description: "Jogos do Brasileirão (football-data.co.uk), um por linha, nomes crus."
    columns:
      - name: season
        tests: [not_null]
      - name: match_date
        tests: [not_null]
      - name: home_team
        tests: [not_null]
      - name: away_team
        tests: [not_null]
      - name: result
        tests:
          - accepted_values:
              arguments:
                values: ["H", "D", "A"]
              config:
                where: "is_played"

  - name: int_matches_unified
    description: "Jogos com times padronizados por team_id."

  - name: fct_matches
    description: "Jogos com times canônicos e probabilidades implícitas do mercado (benchmark)."
    columns:
      - name: home_team_id
        tests: [not_null]
      - name: away_team_id
        tests: [not_null]
      - name: match_date
        tests: [not_null]

  - name: dim_teams
    columns:
      - name: team_id
        tests: [unique, not_null]

  - name: eval_match_scores
    description: "RPS, log loss e Brier jogo a jogo por temporada e modelo (inclui o mercado)."
    columns:
      - name: model
        tests:
          - accepted_values:
              arguments:
                values: ["dixon_coles", "elo", "tabela", "mercado"]

  - name: eval_season_scores
    description: "Brier e log loss das probabilidades de título, G4, Libertadores, Sul-Americana e Z4."

  - name: eval_calibration
    description: "Tabela de calibração das probabilidades por zona (temporadas completas)."
