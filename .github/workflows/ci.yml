name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Testes Python
        run: pytest -q
      - name: dbt build com arquivo sintético (sem acesso à internet)
        run: |
          python -m brasileirao_sim.ingest.footballdata_uk --csv tests/fixtures/BRA_synthetic.csv --out data/raw
          cd dbt && dbt build --profiles-dir .
